name: Deploy to Alibaba Cloud

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 60.205.93.8
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "out/*"
          target: "/tmp/mnb-lab-deploy"
          strip_components: 1

      - name: Deploy and reload
        uses: appleboy/ssh-action@v1
        with:
          host: 60.205.93.8
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo rsync -a --delete /tmp/mnb-lab-deploy/ /var/www/mnb-lab/
            rm -rf /tmp/mnb-lab-deploy
            sudo nginx -t && sudo systemctl reload nginx
            echo "✓ Deploy completed at $(date)"
