# ============================================
# mnb-lab.cn — 课题组官网 (Next.js 静态导出)
# ============================================

server {
    listen 80;
    server_name mnb-lab.cn www.mnb-lab.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mnb-lab.cn www.mnb-lab.cn;

    ssl_certificate     /etc/letsencrypt/live/mnb-lab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mnb-lab.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json text/plain;

    root /var/www/mnb-lab;
    index index.html;

    # HTML 页面 — 不缓存
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Next.js RSC 路由文件（.txt）
    location ~* /__next\..*\.txt$ {
        charset utf-8;
        default_type text/plain;
        try_files $uri =404;
    }

    # 字体文件 — 仅 Cache-Control，不用 expires
    location ~* \.woff2?$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types { font/woff2 woff2; font/woff woff; }
        default_type font/woff2;
        try_files $uri =404;
    }

    # 静态资源缓存（含 webp）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}
