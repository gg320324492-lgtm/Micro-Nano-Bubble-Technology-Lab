# ============================================
# mnb-lab.cn — 课题组官网 (Next.js 静态导出)
# 2026-06-08: 修复 webhint content-type charset / woff2 MIME 类型
# 2026-06-08: HTML no-cache 防止旧 CSS preload 404
# ============================================

server {
    listen 80;
    server_name mnb-lab.cn www.mnb-lab.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mnb-lab.cn www.mnb-lab.cn;

    ssl_certificate     /etc/letsencrypt/live/mnb-lab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mnb-lab.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 默认字符集（含 text/plain 以修复 RSC .txt 文件 charset 问题）
    charset utf-8;
    charset_types text/css text/javascript application/javascript application/json text/plain;

    root /var/www/mnb-lab;
    index index.html;

    # HTML 页面 — 不缓存，确保每次访问获取最新资源引用
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Next.js RSC 路由文件（.txt）— 确保 charset
    location ~* /__next\..*\.txt$ {
        charset utf-8;
        default_type text/plain;
        try_files $uri =404;
    }

    # 字体文件 — 确保正确的 MIME 类型 + 缓存
    location ~* \.woff2$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        types { font/woff2 woff2; }
        default_type font/woff2;
        try_files $uri =404;
    }

    location ~* \.woff$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        types { font/woff woff; }
        default_type font/woff;
        try_files $uri =404;
    }

    # 其他静态资源缓存（content-hash 文件名，可长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|ttf|eot)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
