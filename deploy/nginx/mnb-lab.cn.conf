server {
    listen 80;
    listen [::]:80;
    server_name mnb-lab.cn www.mnb-lab.cn;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mnb-lab.cn www.mnb-lab.cn;

    ssl_certificate /etc/letsencrypt/live/mnb-lab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mnb-lab.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    root /var/www/mnb-lab;
    index index.html;
    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    # Next.js RSC 路由文件（.txt）— 确保 charset
    location ~* /__next\..*\.txt$ {
        charset utf-8;
        default_type text/plain;
        try_files $uri =404;
    }

    # 字体文件 — 确保正确的 MIME 类型 + 缓存
    location ~* \.woff2$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        types { font/woff2 woff2; }
        default_type font/woff2;
        try_files $uri =404;
    }

    location ~* \.woff$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        types { font/woff woff; }
        default_type font/woff;
        try_files $uri =404;
    }

    # 其他静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
